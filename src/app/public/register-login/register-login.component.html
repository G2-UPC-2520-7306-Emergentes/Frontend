<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">

  <h2>Registro de Usuario</h2>

  <div class="form-grid">
    <div class="column">

      <div class="form-group">
        <label for="enterpriseId">ID de Empresa *</label>
        <input id="enterpriseId" type="text" placeholder="Ingresa el ID de tu empresa" formControlName="enterpriseId" class="input-field">
        <div *ngIf="registerForm.get('enterpriseId')?.invalid && registerForm.get('enterpriseId')?.touched" class="validation-error">
          El ID de Empresa es obligatorio.
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input id="email" type="email" placeholder="Ingresa tu email" formControlName="email" class="input-field">
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="validation-error">
          Email es obligatorio y debe ser válido.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input id="password" type="password" placeholder="Ingresa tu contraseña" formControlName="password" minlength="8" class="input-field">
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="validation-error">
          La Contraseña es obligatoria (mín. 8 caracteres).
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña *</label>
        <input id="confirmPassword" type="password" placeholder="Confirma tu contraseña" formControlName="confirmPassword" class="input-field">
      </div>

      <div *ngIf="registerForm?.errors?.['mismatch'] && registerForm.get('confirmPassword')?.touched" class="validation-error">
        Las contraseñas no coinciden.
      </div>

    </div>
  </div>

  <div class="footer-form-section">
    <button type="submit" class="create-account-button" [disabled]="registerForm.invalid">
      Crear Cuenta
    </button>
  </div>
</form>
